syntax = "proto3";

package deployment.v1;
option go_package = "github.com/glebH52-arch/agent-native-paas/api/proto/deployment/v1;deploymentv1";
import "google/protobuf/timestamp.proto";

message DeploymentFailure {
  string failed_stage = 1;
  string error_code = 2;
  string error_message = 3;
  string diagnostic = 4;
  google.protobuf.Timestamp failed_at = 5;
}

message CreateDeploymentRequest {
  string project_id = 1;
  string branch = 2;
}

enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  DEPLOYMENT_STATUS_QUEUED = 1;
  DEPLOYMENT_STATUS_CLONING = 2;
  DEPLOYMENT_STATUS_BUILDING = 3;
  DEPLOYMENT_STATUS_STARTING = 4;
  DEPLOYMENT_STATUS_HEALTHCHECKING = 5;
  DEPLOYMENT_STATUS_RUNNING = 6;
  DEPLOYMENT_STATUS_FAILED = 7;
}

message CreateDeploymentResponse {
    string deployment_id = 1;
    DeploymentStatus status = 2;
}

message GetDeploymentRequest {
    string deployment_id = 1;
}

message Deployment {
    string deployment_id = 1;
    string project_id = 2;
    DeploymentStatus status = 3;
    string repository_url = 4;
    string branch = 5;
    string commit_sha = 6;
    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp updated_at = 8;
    google.protobuf.Timestamp running_at = 9;
    string url = 10;
    DeploymentFailure failure = 11;
}

message GetDeploymentResponse {
  Deployment deployment = 1;
}

service DeploymentService {
  rpc CreateDeployment(CreateDeploymentRequest)
      returns (CreateDeploymentResponse);

  rpc GetDeployment(GetDeploymentRequest)
      returns (GetDeploymentResponse);
}